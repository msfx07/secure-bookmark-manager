{% extends "base.html" %}
{% block title %}Sign In – Sandbox99 Bookmark{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-bookmark-star-fill display-5 text-warning"></i>
          <h4 class="mt-2 fw-semibold">Sign In</h4>
          <p class="text-muted small">Welcome back. Access your bookmarks.</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username"
                     placeholder="Enter your username" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Enter your password" required>
              <button type="button" class="btn btn-outline-secondary pw-toggle"
                      data-target="password" tabindex="-1"
                      aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </div>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          <i class="bi bi-info-circle me-1"></i>
          Contact your administrator for account access.
        </p>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          <i class="bi bi-github me-1"></i>
          Want to run your own copy? Get it on
          <a href="https://github.com/msfx07/secure-bookmark-manager" target="_blank" rel="noopener noreferrer" class="fw-medium">GitHub</a>.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll('.pw-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type     = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type     = 'password';
        icon.className = 'bi bi-eye';
      }
    });
  });
})();
</script>
{% endblock %}
